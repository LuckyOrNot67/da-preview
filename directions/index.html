<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Premium V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap">
<style>
:root{--bg:#111112;--p:#1B1B1D;--l:#303033;--t:#F2F2F0;--s:#A2A2A6;--f:"Geist",system-ui,sans-serif;--m:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:400 15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,p,ul,dl,dd{margin:0;padding:0}ul{list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;appearance:none;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--l)}
.bar h1{font-size:15px;font-weight:600;margin-right:6px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--l);border-radius:9px}
.seg button{min-height:36px;padding:0 13px;border-radius:6px;font-size:14px;color:var(--s)}
.seg button[aria-pressed=true]{background:var(--t);color:#111;font-weight:500}
.act{min-height:38px;padding:0 13px;border:1px solid var(--l);border-radius:9px;font-size:14px}
.act:hover{background:var(--p)}
.sp{flex:1}
.bar a{font-size:14px;color:var(--s)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100svh - 61px)}
.view{position:relative;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;min-width:0}
.fr{position:relative;flex:none;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--l)}
.fr iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block}
.fr.ph{border-radius:22px}
aside{padding:18px;border-left:1px solid var(--l);overflow:auto}
aside h2{font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.lab{margin:18px 0 5px;font:400 12px/1.3 var(--m);color:var(--s)}
.pal{display:flex;gap:6px}
.pal li{flex:1;min-width:0}
.pal i{display:block;height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pal span{display:block;margin-top:3px;font:400 11px/1.2 var(--m);color:var(--s)}
.sample{font-size:30px;line-height:1.1}
.open{display:inline-block;margin-top:18px;padding:10px 13px;background:var(--t);color:#111;border-radius:9px;font-weight:500;text-decoration:none}
.small{margin-top:18px;font-size:13px;color:var(--s)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .view{height:min(78svh,720px)}
  aside{border-left:0;border-top:1px solid var(--l)}
}
</style>
</head>
<body>
<div class="bar">
  <h1>Comparateur</h1>
  <div class="seg" id="dir" role="group" aria-label="Direction">
    <button data-v="v2">Premium V2</button><button data-v="c">Premium</button><button data-v="b">Immersif</button>
  </div>
  <div class="seg" id="dev" role="group" aria-label="Format">
    <button data-v="d">Desktop</button><button data-v="m">Mobile</button>
  </div>
  <div class="seg" id="sec" role="group" aria-label="Partie">
    <button data-v="hero">Hero</button><button data-v="ville">Ville</button><button data-v="concept">Concept</button>
  </div>
  <div class="seg" id="mot" role="group" aria-label="Animation">
    <button data-v="on">Animé</button><button data-v="off">Sans animation</button>
  </div>
  <button class="act" id="re">Rejouer</button>
  <span class="sp"></span>
  <a href="../propositions/b/">Ancienne proposition B</a>
</div>
<div class="wrap">
  <div class="view" id="view"><div class="fr" id="fr"><iframe id="ifr" title="Aperçu de la direction" loading="eager"></iframe></div></div>
  <aside aria-live="polite">
    <h2 id="name"></h2>
    <p id="idea" style="margin-top:8px"></p>
    <p class="lab">Accroche</p><p id="line"></p>
    <p class="lab">Typographie</p><p class="sample" id="sample">Aa</p><p id="type" style="margin-top:4px"></p>
    <p class="lab">Palette</p><ul class="pal" id="pal"></ul>
    <p class="lab">Visuel</p><p id="vis"></p>
    <p class="lab">Animation</p><p id="ani"></p>
    <p class="lab">Références</p><p id="ref"></p>
    <a class="open" id="open" target="_blank" rel="noopener">Ouvrir en plein écran</a>
    <p class="small">Le nom roam est provisoire. Photos créées par IA, marques et campagnes fictives.</p>
  </aside>
</div>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<script>
const D={
 v2:{n:'Premium V2 · proposition de synthèse',i:"L'identité Premium, avec le mobile et l'idée de ville d'Immersif, sans aucun grain. À valider.",l:"Votre marque, en circulation.",tf:'"Archivo",sans-serif',ts:'Aa',ti:'normal',t:"Archivo très gras et élargi, avec une étiquette noire reprise d'Immersif.",p:[['#D6EA12','Citron'],['#0B0C06','Noir'],['#F7F8EE','Blanc cassé']],v:"La berline citron de Premium, en studio puis en ville, et trois véhicules du quotidien.",a:"La voiture blanche prend le covering, quitte le studio et roule jusqu'au soir. La vidéo se lance quand elle est visible et ne bloque pas le scroll.",r:"Premium pour l'identité. Immersif pour le mobile, l'étiquette et la ville."},
 b:{n:'Immersif · référence',i:"Toute la ville est imprimée en trame. Seule la voiture, votre marque, reste en couleur.",l:"La ville bouge. Votre marque aussi.",tf:'"Geist",sans-serif',ts:'Aa',ti:'normal',t:"Geist pour le titre, Geist Mono pour les étiquettes, logo en points.",p:[['#05060C','Nuit'],['#EDEEF7','Trame'],['#FF2E8B','Rose']],v:"Citadine électrique habillée d'une trame rose, de nuit, sur des pavés mouillés.",a:"La ville se dessine en points autour de la voiture. Au survol, la trame s'ouvre sur la vraie photo.",r:"Noomo : profondeur, deux couleurs, trame, étiquette surlignée. Pinterest 10 : rose et noir."},
 c:{n:'Premium · référence',i:"Une seule couleur, une seule image. La voiture devient une campagne ton sur ton.",l:"Votre marque, en circulation.",tf:'"Archivo",sans-serif',ts:'Aa',ti:'normal',t:"Archivo, très gras et élargi, pour le titre et le logo.",p:[['#D6EA12','Citron'],['#0B0C06','Noir']],v:"Berline entièrement habillée de citron dans un studio de la même couleur.",a:"Le point final arrive de la droite et se pose à la fin du titre. Rien d'autre ne bouge.",r:"Pinterest 9 et 10 : monochromie. Logos 2 et 3 : minuscules grasses et point final."}
};
const $=i=>document.getElementById(i),q=new URLSearchParams(location.search);
let S={d:q.get('d')||'v2',v:q.get('v')||(innerWidth<700?'m':'d'),m:'on',s:'hero'};
function fit(){
  const V=$('view'),pad=28,w=S.v==='d'?1440:390,h=S.v==='d'?900:844,k=Math.min((V.clientWidth-pad)/w,(V.clientHeight-pad)/h,1);
  const f=$('fr'),i=$('ifr');i.style.width=w+'px';i.style.height=h+'px';i.style.transform=`scale(${k})`;f.style.width=w*k+'px';f.style.height=h*k+'px';f.classList.toggle('ph',S.v==='m');
}
function load(){const f=$('ifr');f.src='about:blank';requestAnimationFrame(()=>{const q=[];if(S.m==='off')q.push('still=1');if(S.d==='v2'&&S.s!=='hero')q.push('s='+S.s);f.src=`${S.d}/${q.length?'?'+q.join('&'):''}`})}
function ui(){
  $('sec').hidden=S.d!=='v2';$('sec').style.display=S.d==='v2'?'':'none';for(const[id,val]of[['dir',S.d],['dev',S.v],['sec',S.s],['mot',S.m]])[...$(id).children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===val));
  const x=D[S.d];$('name').textContent=x.n;$('idea').textContent=x.i;$('line').textContent=x.l;$('type').textContent=x.t;$('vis').textContent=x.v;$('ani').textContent=x.a;$('ref').textContent=x.r;
  const s=$('sample');s.textContent=x.l;s.style.fontFamily=x.tf;s.style.fontStyle=x.ti;s.style.fontWeight=S.d==='b'?500:800;
  $('pal').innerHTML=x.p.map(([c,n])=>`<li><i style="background:${c}"></i><span>${n}<br>${c}</span></li>`).join('');
  $('open').href=`${S.d}/`;fit();
}
for(const[id,k]of[['dir','d'],['dev','v'],['sec','s'],['mot','m']])$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[k]=b.dataset.v;ui();load()});
$('re').onclick=load;
addEventListener('resize',fit);
addEventListener('keydown',e=>{const k={1:'v2',2:'c',3:'b'}[e.key];if(k){S.d=k;ui();load()}});
ui();load();
</script>
</body>
</html>
